<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="color-scheme" content="dark" />
<title>test</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { color: #fff; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  #led { display: block; position: fixed; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }

  .back {
    position: fixed; top: 18px; left: 20px; z-index: 3;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(255,255,255,0.32); text-decoration: none;
    transition: color .25s ease;
  }
  .back:hover { color: rgba(255,255,255,0.75); }

  .hint {
    position: fixed; inset: 0; z-index: 2; display: flex;
    align-items: center; justify-content: center; pointer-events: none;
    color: rgba(255,255,255,0.30); font-size: 13px; letter-spacing: 0.18em;
    text-transform: uppercase; transition: opacity .6s ease;
  }
  .hint.hidden { opacity: 0; }

  .fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.6); font-size: 14px; padding: 24px; text-align: center; }
</style>
</head>
<body>
  <canvas id="led"></canvas>
  <a href="index.html" class="back">&larr; back</a>
  <div class="hint" id="hint">move your cursor to light the panel</div>
  <div class="fallback" id="fallback">Your browser doesn&rsquo;t support WebGL, so this panel can&rsquo;t light up.</div>

  <script>
  (function () {
    var canvas = document.getElementById('led');
    var gl = canvas.getContext('webgl', { antialias: false, alpha: false, premultipliedAlpha: false })
          || canvas.getContext('experimental-webgl');
    if (!gl) { document.getElementById('fallback').style.display = 'flex'; document.getElementById('hint').style.display = 'none'; return; }

    var MAX_PTS = 40;

    var vsrc = [
      'attribute vec2 aPos;',
      'void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }'
    ].join('\n');

    var fsrc = [
      '#ifdef GL_FRAGMENT_PRECISION_HIGH',
      'precision highp float;',
      '#else',
      'precision mediump float;',
      '#endif',
      'uniform vec2  uRes;',
      'uniform float uCell;',
      'uniform vec3  uPts[40];',   // x, y (bottom-left px), life
      'uniform int   uCount;',
      'uniform vec2  uMouse;',     // smoothed cursor (bottom-left px)
      'uniform float uMouseE;',    // mouse energy (decays when idle)',
      'uniform float uTime;',
      '',
      'float d2(vec2 v){ return dot(v, v); }',
      '',
      'void main(){',
      '  vec2 fc = gl_FragCoord.xy;',
      '',
      '  // ---- backlight energy: sum of trail points + live cursor core ----',
      '  float sigma = uCell * 7.0;',
      '  float k = 1.0 / (2.0 * sigma * sigma);',
      '  float energy = 0.0;',
      '  for (int i = 0; i < 40; i++) {',
      '    if (i >= uCount) break;',
      '    vec3 p = uPts[i];',
      '    energy += p.z * exp(-d2(fc - p.xy) * k);',
      '  }',
      '  float cs = uCell * 4.0;',
      '  energy += uMouseE * 1.35 * exp(-d2(fc - uMouse) / (2.0 * cs * cs));',
      '  energy = clamp(energy, 0.0, 1.7);',
      '',
      '  // ---- RGB subpixel matrix (R dot | G dot | B bar) ----',
      '  float cell = uCell;',
      '  vec2 lp = mod(fc, vec2(cell));',
      '  float third = cell / 3.0;',
      '  vec2 rC = vec2(third * 0.5, cell * 0.5);',
      '  vec2 gC = vec2(third * 1.5, cell * 0.5);',
      '  float rDot = 1.0 - smoothstep(third * 0.32, third * 0.54, length(lp - rC));',
      '  float gDot = 1.0 - smoothstep(third * 0.32, third * 0.54, length(lp - gC));',
      '  float bx = 1.0 - smoothstep(third * 0.12, third * 0.26, abs(lp.x - third * 2.5));',
      '  float by = 1.0 - smoothstep(cell * 0.30, cell * 0.44, abs(lp.y - cell * 0.5));',
      '  float bBar = bx * by;',
      '',
      '  float base = 0.04;',
      '  float b = base + energy;',
      '  vec3 col = vec3(0.0);',
      '  col += vec3(1.00, 0.13, 0.16) * rDot * b * 1.20;',
      '  col += vec3(0.22, 1.00, 0.32) * gDot * b * 1.05;',
      '  col += vec3(0.20, 0.44, 1.00) * bBar * b * 1.00;',
      '',
      '  // diffuse panel bloom between the dots (near-white)',
      '  col += vec3(0.80, 0.86, 1.00) * energy * 0.075;',
      '',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n');

    function compile(type, src) {
      var s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); }
      return s;
    }
    var prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsrc));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsrc));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); }
    gl.useProgram(prog);

    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    var aPos = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

    var U = {
      res:    gl.getUniformLocation(prog, 'uRes'),
      cell:   gl.getUniformLocation(prog, 'uCell'),
      pts:    gl.getUniformLocation(prog, 'uPts'),
      count:  gl.getUniformLocation(prog, 'uCount'),
      mouse:  gl.getUniformLocation(prog, 'uMouse'),
      mouseE: gl.getUniformLocation(prog, 'uMouseE'),
      time:   gl.getUniformLocation(prog, 'uTime')
    };

    var dpr = 1, CSS_CELL = 10, cellPx = 20;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width  = Math.floor(innerWidth  * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      cellPx = CSS_CELL * dpr;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    // ---- cursor state (all in device px, bottom-left origin) ----
    var pts = [];              // {x, y, life}
    var tx = -9999, ty = -9999, sx = -9999, sy = -9999;
    var mouseE = 0, lastX = -9999, lastY = -9999, hasPointer = false;
    var hint = document.getElementById('hint'), hinted = false;

    function toDev(clientX, clientY) {
      return [clientX * dpr, (innerHeight - clientY) * dpr];
    }
    function onMove(clientX, clientY) {
      var c = toDev(clientX, clientY);
      tx = c[0]; ty = c[1];
      if (!hasPointer) { sx = tx; sy = ty; hasPointer = true; }
      var dx = tx - lastX, dy = ty - lastY;
      if (dx * dx + dy * dy > (6 * dpr) * (6 * dpr)) {
        pts.push({ x: tx, y: ty, life: 1.0 });
        if (pts.length > MAX_PTS) pts.shift();
        lastX = tx; lastY = ty;
      }
      mouseE = 1.0;
      if (!hinted) { hinted = true; hint.classList.add('hidden'); }
    }
    canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY); }, { passive: true });
    canvas.addEventListener('pointerdown', function (e) { onMove(e.clientX, e.clientY); mouseE = 1.4; }, { passive: true });
    canvas.addEventListener('pointerleave', function () { hasPointer = false; });

    var buf120 = new Float32Array(MAX_PTS * 3);
    var t0 = performance.now();

    function frame() {
      // decay trail + mouse energy
      for (var i = pts.length - 1; i >= 0; i--) {
        pts[i].life *= 0.93;
        if (pts[i].life < 0.02) pts.splice(i, 1);
      }
      mouseE *= 0.92;
      // smooth cursor
      if (hasPointer) { sx += (tx - sx) * 0.22; sy += (ty - sy) * 0.22; }

      var n = pts.length;
      for (var j = 0; j < MAX_PTS; j++) {
        if (j < n) { buf120[j*3] = pts[j].x; buf120[j*3+1] = pts[j].y; buf120[j*3+2] = pts[j].life; }
        else { buf120[j*3] = 0; buf120[j*3+1] = 0; buf120[j*3+2] = 0; }
      }

      gl.uniform2f(U.res, canvas.width, canvas.height);
      gl.uniform1f(U.cell, cellPx);
      gl.uniform3fv(U.pts, buf120);
      gl.uniform1i(U.count, n);
      gl.uniform2f(U.mouse, sx, sy);
      gl.uniform1f(U.mouseE, hasPointer ? Math.max(mouseE, 0.0) : mouseE);
      gl.uniform1f(U.time, (performance.now() - t0) / 1000);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // prevent right-click image save prompt noise / keep it clean
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  })();
  </script>
</body>
</html>
